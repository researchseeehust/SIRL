<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 480" font-family="Google Sans, Helvetica, Arial, sans-serif">
<defs>
<marker id="arrowhead" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 8 3.5, 0 7" fill="#333333"/></marker>
</defs>
<rect x="0" y="0" width="1400" height="480" fill="#ffffff"/>
<g id="leader">
<rect x="30" y="40" width="250" height="120" rx="12" ry="12" fill="#ffffff" stroke="#5b6b7a" stroke-width="2.5"/>
<rect x="30" y="40" width="7" height="120" rx="3.5" ry="3.5" fill="#5b6b7a"/>
<text x="155.0" y="83.0" text-anchor="middle" font-family="Google Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a1a1a">Virtual Leader + Graph 𝒢</text>
<text x="155.0" y="105.0" text-anchor="middle" font-family="Google Sans, Helvetica, Arial, sans-serif" font-size="14.5" fill="#3a3a3a">q₀(t), η₀(t)</text>
<text x="155.0" y="127.0" text-anchor="middle" font-family="Google Sans, Helvetica, Arial, sans-serif" font-size="14.5" fill="#3a3a3a">neighbours j∈ℕᵢ, leader link bᵢ</text>
</g>
<g id="error">
<rect x="330" y="40" width="210" height="120" rx="12" ry="12" fill="#ffffff" stroke="#2f6fb0" stroke-width="2.5"/>
<rect x="330" y="40" width="7" height="120" rx="3.5" ry="3.5" fill="#2f6fb0"/>
<text x="435.0" y="94.0" text-anchor="middle" font-family="Google Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a1a1a">Neighbourhood Error</text>
<text x="435.0" y="116.0" text-anchor="middle" font-family="Google Sans, Helvetica, Arial, sans-serif" font-size="14.5" fill="#3a3a3a">δᵢ = [δ_pᵢ ; δ_ηᵢ] ∈ ℝ⁵</text>
</g>
<g id="critic">
<rect x="590" y="40" width="220" height="120" rx="12" ry="12" fill="#ffffff" stroke="#7b4fb0" stroke-width="2.5"/>
<rect x="590" y="40" width="7" height="120" rx="3.5" ry="3.5" fill="#7b4fb0"/>
<text x="700.0" y="83.0" text-anchor="middle" font-family="Google Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a1a1a">Critic NN</text>
<text x="700.0" y="105.0" text-anchor="middle" font-family="Google Sans, Helvetica, Arial, sans-serif" font-size="14.5" fill="#3a3a3a">φᵢ(δᵢ)∈ℝ¹⁵, ∇φᵢ</text>
<text x="700.0" y="127.0" text-anchor="middle" font-family="Google Sans, Helvetica, Arial, sans-serif" font-size="14.5" fill="#3a3a3a">(quadratic bases)</text>
</g>
<g id="bellman">
<rect x="860" y="40" width="280" height="120" rx="12" ry="12" fill="#ffffff" stroke="#c07a1e" stroke-width="2.5"/>
<rect x="860" y="40" width="7" height="120" rx="3.5" ry="3.5" fill="#c07a1e"/>
<text x="1000.0" y="83.0" text-anchor="middle" font-family="Google Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a1a1a">IRL Bellman Residual Ψᵢ</text>
<text x="1000.0" y="105.0" text-anchor="middle" font-family="Google Sans, Helvetica, Arial, sans-serif" font-size="14.5" fill="#3a3a3a">Ψᵢ = Δφᵢᵀ Ŵᵢ + ϱᵢ  (T-s window)</text>
<text x="1000.0" y="127.0" text-anchor="middle" font-family="Google Sans, Helvetica, Arial, sans-serif" font-size="14.5" fill="#3a3a3a">+ Experience Replay (stack, l=20)</text>
</g>
<g id="adapt">
<rect x="860" y="300" width="230" height="120" rx="12" ry="12" fill="#ffffff" stroke="#1e8a72" stroke-width="2.5"/>
<rect x="860" y="300" width="7" height="120" rx="3.5" ry="3.5" fill="#1e8a72"/>
<text x="975.0" y="343.0" text-anchor="middle" font-family="Google Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a1a1a">Adaptive Law  (eq. 3.78)</text>
<text x="975.0" y="365.0" text-anchor="middle" font-family="Google Sans, Helvetica, Arial, sans-serif" font-size="14.5" fill="#3a3a3a">Ŵ̇ᵢ = −αᵢ(⋯)Ψᵢ + ξᵢΘᵢ</text>
<text x="975.0" y="387.0" text-anchor="middle" font-family="Google Sans, Helvetica, Arial, sans-serif" font-size="14.5" fill="#3a3a3a">⇒ critic weights Ŵᵢ</text>
</g>
<g id="policy">
<rect x="550" y="300" width="230" height="120" rx="12" ry="12" fill="#ffffff" stroke="#c0392b" stroke-width="2.5"/>
<rect x="550" y="300" width="7" height="120" rx="3.5" ry="3.5" fill="#c0392b"/>
<text x="665.0" y="343.0" text-anchor="middle" font-family="Google Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a1a1a">H∞ Policy</text>
<text x="665.0" y="365.0" text-anchor="middle" font-family="Google Sans, Helvetica, Arial, sans-serif" font-size="14.5" fill="#3a3a3a">ηᵢ* (eq. 3.66)   ϑ̂ᵢ (eq. 3.67)</text>
<text x="665.0" y="387.0" text-anchor="middle" font-family="Google Sans, Helvetica, Arial, sans-serif" font-size="14.5" fill="#3a3a3a">worst-case disturbance = self-play adversary</text>
</g>
<g id="plant">
<rect x="240" y="300" width="230" height="120" rx="12" ry="12" fill="#ffffff" stroke="#2e8b3f" stroke-width="2.5"/>
<rect x="240" y="300" width="7" height="120" rx="3.5" ry="3.5" fill="#2e8b3f"/>
<text x="355.0" y="354.0" text-anchor="middle" font-family="Google Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a1a1a">WMR Kinematics (Plant)</text>
<text x="355.0" y="376.0" text-anchor="middle" font-family="Google Sans, Helvetica, Arial, sans-serif" font-size="14.5" fill="#3a3a3a">ṗᵢ = Hᵢ(pᵢ) ηᵢ</text>
</g>
<line x1="280" y1="100.0" x2="330" y2="100.0" stroke="#333333" stroke-width="2.2" marker-end="url(#arrowhead)"/>
<line x1="540" y1="100.0" x2="590" y2="100.0" stroke="#333333" stroke-width="2.2" marker-end="url(#arrowhead)"/>
<line x1="810" y1="100.0" x2="860" y2="100.0" stroke="#333333" stroke-width="2.2" marker-end="url(#arrowhead)"/>
<line x1="1000.0" y1="160" x2="1000.0" y2="300" stroke="#333333" stroke-width="2.2" marker-end="url(#arrowhead)"/>
<text x="1000.0" y="222.0" text-anchor="middle" font-family="Google Sans, Helvetica, Arial, sans-serif" font-size="13" font-style="italic" fill="#333333">Ψᵢ, history stack</text>
<line x1="860" y1="360.0" x2="780" y2="360.0" stroke="#333333" stroke-width="2.2" marker-end="url(#arrowhead)"/>
<text x="820.0" y="352.0" text-anchor="middle" font-family="Google Sans, Helvetica, Arial, sans-serif" font-size="13" font-style="italic" fill="#333333">Ŵᵢ</text>
<line x1="550" y1="360.0" x2="470" y2="360.0" stroke="#333333" stroke-width="2.2" marker-end="url(#arrowhead)"/>
<text x="510.0" y="352.0" text-anchor="middle" font-family="Google Sans, Helvetica, Arial, sans-serif" font-size="13" font-style="italic" fill="#333333">ηᵢ*, ϑ̂ᵢ</text>
<path d="M 355.0 300 C 345.0 210, 425.0 250, 435.0 162" fill="none" stroke="#8a1f1f" stroke-width="2.2" marker-end="url(#arrowhead)"/>
<text x="325.0" y="231.0" text-anchor="middle" font-family="Google Sans, Helvetica, Arial, sans-serif" font-size="13" font-style="italic" fill="#8a1f1f">state feedback  pᵢ, ηᵢ</text>
<path d="M 230.0 160 C 270.0 320, 634.5 260, 894.5 300" fill="none" stroke="#6b6b6b" stroke-width="2.2" stroke-dasharray="6,5" marker-end="url(#arrowhead)"/>
<text x="562.25" y="224.0" text-anchor="middle" font-family="Google Sans, Helvetica, Arial, sans-serif" font-size="13" font-style="italic" fill="#6b6b6b">neighbour data  δⱼ, Ŵⱼ, ∇φⱼ  (for rᵢ, Θᵢ)</text>
</svg>